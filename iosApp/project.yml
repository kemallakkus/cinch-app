# Xcode projesi bu dosyadan üretilir (elle düzenlenen .pbxproj yok):
#   brew install xcodegen
#   cd iosApp && xcodegen
# Sonra iosApp.xcodeproj açılır; imzalama için DEVELOPMENT_TEAM'i kendi takım kimliğinle doldur
# (App Group "group.com.cinch.app" takımda tanımlı olmalı; Xcode "Signing & Capabilities"te kendisi önerir).
name: iosApp

options:
  bundleIdPrefix: com.cinch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: Cinch
        PRODUCT_BUNDLE_IDENTIFIER: com.cinch.app
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # Kotlin framework'ü (ComposeApp) Gradle üretir; Xcode yalnız bağlar.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_PREVIEWS: NO
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: CinchWidget
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

  CinchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CinchWidget
    settings:
      base:
        PRODUCT_NAME: CinchWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.cinch.app.widget
        INFOPLIST_FILE: CinchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CinchWidget/CinchWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
